name: "CI"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Chat widget is up to date
        run: npm run build:widget && git diff --exit-code src/lib/mcp/widget.generated.ts

      - name: Build (web + CLI)
        run: npm run build

      - name: Claude Desktop extension and npm package start and answer
        if: matrix.node-version == 22
        run: |
          npm run build:mcpb
          mkdir -p /tmp/ext && cd /tmp/ext && unzip -q "$GITHUB_WORKSPACE/dist/recallforge.mcpb"
          RECALLFORGE_DIR=/tmp/ext-data node --no-warnings server/index.mjs import "$GITHUB_WORKSPACE/tests/data/anki-modern.apkg"
          RECALLFORGE_DIR=/tmp/ext-data node --no-warnings server/index.mjs stats

      - name: CLI smoke test
        run: node dist/cli.mjs path
